<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนที่โรงเรียนแบบโต้ตอบ | Interactive School Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --cream:        #F6EFDB;
  --cream-deep:   #EFE4C4;
  --ink:          #3D2B1F;
  --ink-soft:     #6B5A48;
  --navy:         #1E3A5F;
  --navy-deep:    #142A45;
  --brass:        #C89B3C;
  --brass-light:  #E4C57A;
  --teal:         #2F8C82;
  --card:         #FFFDF7;
  --shadow-color: 33, 24, 16;

  --font-display: 'Kanit', 'Noto Sans Thai', sans-serif;
  --font-body:    'Sarabun', 'Noto Sans Thai', sans-serif;

  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 100% 0%, rgba(200,155,60,0.10), transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(47,140,130,0.08), transparent 45%);
}

img { max-width: 100%; }
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.app-shell {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 20px 56px;
}

.kiosk-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  padding-bottom: 18px;
  margin-bottom: 22px;
  border-bottom: 3px dashed rgba(61,43,31,0.35);
}
.kiosk-eyebrow {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--teal);
  text-transform: uppercase;
  margin: 0 0 6px;
}
.kiosk-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(26px, 4vw, 38px);
  color: var(--navy-deep);
  margin: 0;
  line-height: 1.15;
}
.kiosk-sub {
  font-size: 15px;
  color: var(--ink-soft);
  margin: 8px 0 0;
  max-width: 46ch;
}
.kiosk-count {
  font-family: var(--font-display);
  background: var(--navy-deep);
  color: var(--cream);
  border-radius: var(--radius-md);
  padding: 12px 20px;
  text-align: center;
  min-width: 108px;
  box-shadow: 0 8px 18px -8px rgba(var(--shadow-color), 0.5);
}
.kiosk-count strong { display: block; font-size: 26px; font-weight: 700; line-height: 1; }
.kiosk-count span { display: block; font-size: 11px; margin-top: 4px; color: var(--brass-light); letter-spacing: 0.06em; }

.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1.5px solid rgba(61,43,31,0.22);
  background: var(--card);
  color: var(--ink);
  border-radius: 999px;
  padding: 7px 14px 7px 10px;
  font-size: 13.5px;
  font-weight: 500;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.filter-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.filter-chip:hover { transform: translateY(-1px); box-shadow: 0 4px 10px -6px rgba(var(--shadow-color), 0.6); }
.filter-chip.active { border-color: transparent; color: #fff; background: var(--chip-color, var(--navy)); }
.filter-chip.active .dot { background: #fff !important; }

.map-frame {
  position: relative;
  border-radius: var(--radius-lg);
  padding: 10px;
  background: linear-gradient(155deg, var(--brass-light), var(--brass) 55%, #A87E2A);
  box-shadow: 0 22px 44px -20px rgba(var(--shadow-color), 0.55);
}
.map-viewport {
  position: relative;
  width: 100%;
  aspect-ratio: 1080 / 608;
  overflow: hidden;
  border-radius: calc(var(--radius-lg) - 6px);
  background: var(--navy-deep);
  border: 1px solid rgba(61,43,31,0.25);
}
.map-stage {
  position: absolute;
  inset: 0;
  transform-origin: 0 0;
  transform: translate(0px, 0px) scale(1);
  transition: transform 0.9s cubic-bezier(0.65, 0, 0.32, 1);
  will-change: transform;
}
.map-stage img.map-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
.map-hint {
  position: absolute;
  left: 14px;
  bottom: 14px;
  background: rgba(61,43,31,0.78);
  color: var(--cream);
  font-size: 12.5px;
  padding: 7px 12px;
  border-radius: 999px;
  z-index: 5;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.map-viewport.zoomed .map-hint { opacity: 0; }

.hotspot {
  position: absolute;
  z-index: 4;
  background: none;
  border: none;
  padding: 0;
  opacity: 0;
  transform: translate(-50%, -100%) scale(0.3);
  transition: opacity 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.hotspot.is-visible {
  opacity: 1;
  transform: translate(-50%, -100%) scale(1);
}
.map-viewport.zoomed .hotspot {
  opacity: 0 !important;
  transform: translate(-50%, -100%) scale(0.6) !important;
  pointer-events: none;
}

.hotspot-pin {
  position: relative;
  width: 32px;
  height: 32px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  background: var(--pin-color, var(--navy));
  border: 2px solid var(--card);
  box-shadow: 0 4px 10px -3px rgba(var(--shadow-color), 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.hotspot-pin .glyph { transform: rotate(45deg); font-size: 15px; line-height: 1; }
.hotspot:hover .hotspot-pin,
.hotspot:focus-visible .hotspot-pin {
  transform: rotate(-45deg) scale(1.25);
  box-shadow: 0 6px 16px -4px rgba(var(--shadow-color), 0.85);
}

.hotspot-tooltip {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  transform: translate(-50%, 6px);
  background: var(--ink);
  color: var(--cream);
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.hotspot-tooltip::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--ink);
}
.hotspot:hover .hotspot-tooltip,
.hotspot:focus-visible .hotspot-tooltip {
  opacity: 1;
  transform: translate(-50%, 0);
}
.hotspot.dimmed .hotspot-pin { opacity: 0.25; filter: grayscale(50%); }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 14, 9, 0.7);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
  z-index: 50;
}
.modal-backdrop.open { opacity: 1; pointer-events: auto; }

.modal-card {
  position: relative;
  background: var(--card);
  width: min(920px, 100%);
  max-height: min(640px, 88vh);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: grid;
  grid-template-columns: 45% 55%;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
  transform: translateY(18px) scale(0.98);
  opacity: 0;
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.35s ease;
}
.modal-backdrop.open .modal-card { transform: translateY(0) scale(1); opacity: 1; }

.modal-photo {
  position: relative;
  background: linear-gradient(155deg, var(--photo-color, var(--navy)), var(--ink));
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.photo-slider {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  width: 100%;
  height: 100%;
  scrollbar-width: none;
}
.photo-slider::-webkit-scrollbar { display: none; }
.photo-slider .slide {
  width: 100%;
  height: 100%;
  flex-shrink: 0;
  scroll-snap-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.photo-slider img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}
.slider-controls {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
}
.slider-btn {
  pointer-events: auto;
  background: rgba(0,0,0,0.45);
  color: #fff;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  backdrop-filter: blur(4px);
  transition: background 0.2s;
}
.slider-btn:hover { background: rgba(0,0,0,0.8); }
.slider-dots {
  position: absolute;
  bottom: 16px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 6px;
  pointer-events: none;
}
.slider-dots span {
  width: 7px;
  height: 7px;
  background: rgba(255,255,255,0.4);
  border-radius: 50%;
  transition: all 0.25s ease;
}
.slider-dots span.active { background: #fff; transform: scale(1.4); }

.modal-info {
  padding: 26px 30px 26px 28px;
  overflow-y: auto;
  position: relative;
  border-left: 3px dashed rgba(61,43,31,0.22);
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 10;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--cream-deep);
  color: var(--ink);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px -3px rgba(var(--shadow-color), 0.5);
  transition: background 0.15s ease, transform 0.15s ease;
}
.modal-close:hover { background: var(--brass-light); transform: rotate(90deg); }
.modal-id { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; color: var(--teal); letter-spacing: 0.08em; margin: 0 0 6px; }
.modal-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--navy-deep); margin: 0 0 4px; padding-right: 40px; }
.modal-tagline { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 16px; }
.modal-desc { margin: 0 0 20px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.modal-desc li { font-size: 14.5px; line-height: 1.65; padding-left: 16px; position: relative; color: var(--ink); }
.modal-desc li::before { content: ""; position: absolute; left: 0; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }

.modal-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--navy-deep);
  color: var(--cream);
  border: none;
  border-radius: 999px;
  padding: 11px 22px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s ease, transform 0.15s ease;
}
.modal-back-btn:hover { background: var(--teal); transform: translateX(-2px); }
.kiosk-footer { margin-top: 22px; text-align: center; font-size: 12.5px; color: var(--ink-soft); }

@media (max-width: 760px) {
  .app-shell { padding: 18px 14px 40px; }
  .kiosk-header { align-items: flex-start; }
  .kiosk-count { min-width: 90px; padding: 10px 14px; }
  .modal-card { grid-template-columns: 1fr; grid-template-rows: auto 1fr; max-height: 92vh; }
  .modal-photo { aspect-ratio: 16 / 9; height: auto; }
  .modal-info { border-left: none; border-top: 3px dashed rgba(61,43,31,0.22); padding: 22px 20px; }
  .modal-title { font-size: 21px; }
}
</style>
</head>
<body>

<div class="app-shell">
  <header class="kiosk-header">
    <div>
      <p class="kiosk-eyebrow">School Wayfinding Directory</p>
      <h1 class="kiosk-title">แผนที่โรงเรียนแบบโต้ตอบ</h1>
      <p class="kiosk-sub">แตะหมุดบนแผนที่เพื่อดูรายละเอียดตำแหน่งและอาคารภายในโรงเรียน</p>
    </div>
    <div class="kiosk-count">
      <strong id="countValue">0</strong>
      <span>จุดสำคัญ</span>
    </div>
  </header>

  <div class="filter-row" id="filterRow"></div>

  <div class="map-frame">
    <div class="map-viewport" id="mapViewport">
      <div class="map-stage" id="mapStage">
        <img class="map-bg" id="mapBgImage" src="map.png" alt="แผนที่โรงเรียน" onerror="this.src='map.png'">
        <div class="hotspot-layer" id="hotspotLayer"></div>
      </div>
      <div class="map-hint">แตะหมุดบนแผนที่เพื่อดูรายละเอียด</div>
    </div>
  </div>

  <footer class="kiosk-footer">
    ระบบนำทางแผนที่โรงเรียน — พัฒนาสำหรับงานสารสนเทศโรงเรียน
  </footer>
</div>

<!-- Modal Container -->
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card" id="modalCard">
    <button type="button" class="modal-close" id="modalCloseBtn" aria-label="ปิด">✕</button>

    <div class="modal-photo" id="modalPhoto">
      <div class="photo-slider" id="photoSlider"></div>
      <div class="slider-controls">
        <button class="slider-btn prev" id="sliderPrev" aria-label="ก่อนหน้า">❮</button>
        <button class="slider-btn next" id="sliderNext" aria-label="ถัดไป">❯</button>
      </div>
      <div class="slider-dots" id="sliderDots"></div>
      <span class="category-tag" id="modalCategory"></span>
    </div>

    <div class="modal-info">
      <p class="modal-id" id="modalId"></p>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-tagline" id="modalTagline"></p>
      <ul class="modal-desc" id="modalDesc"></ul>
      <button type="button" class="modal-back-btn" id="modalBackBtn">
        <span aria-hidden="true">←</span> ย้อนกลับไปแผนที่หลัก
      </button>
    </div>
  </div>
</div>

let activeMarker = null;
let currentFilter = 'all';

const viewport = document.getElementById('mapViewport');
const stage = document.getElementById('mapStage');
const hotspotLayer = document.getElementById('hotspotLayer');
const filterRow = document.getElementById('filterRow');
const countValue = document.getElementById('countValue');

const modalBackdrop = document.getElementById('modalBackdrop');
const modalCloseBtn = document.getElementById('modalCloseBtn');
const modalBackBtn = document.getElementById('modalBackBtn');
const photoSlider = document.getElementById('photoSlider');
const sliderPrev = document.getElementById('sliderPrev');
const sliderNext = document.getElementById('sliderNext');
const sliderDots = document.getElementById('sliderDots');
const modalCategory = document.getElementById('modalCategory');
const modalId = document.getElementById('modalId');
const modalTitle = document.getElementById('modalTitle');
const modalTagline = document.getElementById('modalTagline');
const modalDesc = document.getElementById('modalDesc');

function initApp() {
  renderFilters();
  renderHotspots();
  updateCount(SCHOOL_MAP_DATA.length);
  
  modalCloseBtn.addEventListener('click', closeModal);
  modalBackBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', function(e) {
    if (e.target === modalBackdrop) closeModal();
  });

  sliderPrev.addEventListener('click', function() { scrollSlider(-1); });
  sliderNext.addEventListener('click', function() { scrollSlider(1); });
}

function renderFilters() {
  var categories = ['all'].concat(Array.from(new Set(SCHOOL_MAP_DATA.map(function(d) { return d.category; }))));
  filterRow.innerHTML = '';

  categories.forEach(function(cat) {
    var chip = document.createElement('button');
    chip.className = 'filter-chip ' + (cat === 'all' ? 'active' : '');
    var color = CATEGORY_COLORS[cat] || '#1E3A5F';
    chip.style.setProperty('--chip-color', color);

    var labelText = cat === 'all' ? 'ทั้งหมด (' + SCHOOL_MAP_DATA.length + ')' : cat;
    chip.innerHTML = '<span class="dot" style="background: ' + color + '"></span><span>' + labelText + '</span>';

    chip.addEventListener('click', function() {
      document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
      chip.classList.add('active');
      filterByCategory(cat);
    });

    filterRow.appendChild(chip);
  });
}

function renderHotspots() {
  hotspotLayer.innerHTML = '';

  SCHOOL_MAP_DATA.forEach(function(item) {
    var btn = document.createElement('button');
    btn.className = 'hotspot is-visible';
    btn.style.left = item.coordinates.x + '%';
    btn.style.top = item.coordinates.y + '%';
    btn.dataset.id = item.id;
    btn.dataset.category = item.category;

    var pinColor = CATEGORY_COLORS[item.category] || '#1E3A5F';

    btn.innerHTML = '<div class="hotspot-pin" style="--pin-color: ' + pinColor + '"><span class="glyph">' + item.icon + '</span></div><div class="hotspot-tooltip">' + item.name + '</div>';

    btn.addEventListener('click', function() {
      selectLocation(item, btn);
    });

    hotspotLayer.appendChild(btn);
  });
}

function filterByCategory(cat) {
  currentFilter = cat;
  var count = 0;

  document.querySelectorAll('.hotspot').forEach(function(el) {
    var itemCat = el.dataset.category;
    if (cat === 'all' || itemCat === cat) {
      el.classList.remove('dimmed');
      el.style.pointerEvents = 'auto';
      count++;
    } else {
      el.classList.add('dimmed');
      el.style.pointerEvents = 'none';
    }
  });

  updateCount(count);
  if (viewport.classList.contains('zoomed')) resetZoom();
}

function updateCount(n) {
  countValue.textContent = n;
}

function selectLocation(item, el) {
  activeMarker = el;
  zoomToCoordinates(item.coordinates.x, item.coordinates.y);
  openModal(item);
}

function zoomToCoordinates(xPercent, yPercent) {
  viewport.classList.add('zoomed');
  var scale = 2.4;
  var viewportWidth = viewport.clientWidth;
  var viewportHeight = viewport.clientHeight;

  var targetX = (xPercent / 100) * viewportWidth;
  var targetY = (yPercent / 100) * viewportHeight;

  var translateX = viewportWidth / 2 - targetX * scale;
  var translateY = viewportHeight / 2 - targetY * scale;

  var maxX = 0;
  var minX = viewportWidth * (1 - scale);
  var maxY = 0;
  var minY = viewportHeight * (1 - scale);

  translateX = Math.max(minX, Math.min(maxX, translateX));
  translateY = Math.max(minY, Math.min(maxY, translateY));

  stage.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')';
}

function resetZoom() {
  viewport.classList.remove('zoomed');
  stage.style.transform = 'translate(0px, 0px) scale(1)';
  activeMarker = null;
}

function openModal(item) {
  modalId.textContent = 'จุดที่ #' + item.id + ' • ' + item.category;
  modalTitle.textContent = item.name;
  modalTagline.textContent = item.tagline;
  modalCategory.textContent = item.category;

  modalCategory.style.background = CATEGORY_COLORS[item.category] || '#1E3A5F';

  modalDesc.innerHTML = '';
  item.description.forEach(function(desc) {
    var li = document.createElement('li');
    li.textContent = desc;
    modalDesc.appendChild(li);
  });

  photoSlider.innerHTML = '';
  sliderDots.innerHTML = '';

  item.images.forEach(function(imgUrl, idx) {
    var slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = '<img src="' + imgUrl + '" alt="' + item.name + ' รูปที่ ' + (idx + 1) + '" loading="lazy">';
    photoSlider.appendChild(slide);

    var dot = document.createElement('span');
    if (idx === 0) dot.className = 'active';
    sliderDots.appendChild(dot);
  });

  modalBackdrop.classList.add('open');
}

function closeModal() {
  modalBackdrop.classList.remove('open');
  resetZoom();
}

function scrollSlider(direction) {
  var slideWidth = photoSlider.clientWidth;
  photoSlider.scrollBy({ left: direction * slideWidth, behavior: 'smooth' });
}

photoSlider.addEventListener('scroll', function() {
  var slideWidth = photoSlider.clientWidth;
  var index = Math.round(photoSlider.scrollLeft / slideWidth);
  var dots = sliderDots.querySelectorAll('span');
  dots.forEach(function(dot, idx) {
    dot.classList.toggle('active', idx === index);
  });
});

window.addEventListener('DOMContentLoaded', initApp);
</script>
